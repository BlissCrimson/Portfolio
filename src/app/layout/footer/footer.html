@let t = translation.texts();

<ul class="footer-socials">
  @for (social of socials; track social.key) {
    <li>
      <a [href]="social.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="t.social[social.key]">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="social.path" /></svg>
      </a>
    </li>
  }
</ul>

<footer class="site-footer">
  <svg class="site-footer__logo" viewBox="0 0 120 80" aria-hidden="true">
    <path id="footer-logo-arc" d="M12 72a48 48 0 0 1 96 0" fill="none" />
    <text class="site-footer__logo-arc">
      <textPath href="#footer-logo-arc" startOffset="50%" text-anchor="middle">frontend developer</textPath>
    </text>
    <svg x="34" y="36" width="52" height="36" viewBox="319 393 781 542">
      <path class="site-footer__logo-initials" [attr.d]="monogramPath" />
    </svg>
  </svg>
  <nav class="site-footer__links">
    <a routerLink="/imprint" routerLinkActive="is-active">{{ t.footer.legal }}</a>
    <a routerLink="/privacy" routerLinkActive="is-active">{{ t.footer.privacy }}</a>
  </nav>
  <p>&copy; Matthias Tausch {{ year }}</p>
</footer>
