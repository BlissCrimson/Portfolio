<nav class="nav">
  <ul class="nav__list">
    @for (link of links; track link.id) {
      <li class="nav__item">
        @if (active() === link.id) {
          <span class="btn__nav--point"></span>
        }
        <a class="btn btn__nav" routerLink="/" [fragment]="link.id"
           [class.is-active]="active() === link.id">
          <span>{{ link.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
