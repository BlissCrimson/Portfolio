@let t = translation.texts();

<div class="panel__inner">
  <h2 class="section-title outline-text">{{ t.why.title }}</h2>

  <div class="why">
    <p>{{ t.why.text }}</p>
    <h3 class="why__subtitle">{{ t.why.iAm }}</h3>

    <ul class="why__facts">
      <li>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill-rule="evenodd"
            d="M12 2a8 8 0 0 0-8 8c0 5.5 8 12 8 12s8-6.5 8-12a8 8 0 0 0-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z" />
          <path class="why__detail why__extra" fill-rule="evenodd"
            d="M12 21c3.900 0 7 .9 7 2s-3.100 2-7 2-7-.9-7-2 3.100-2 7-2Zm0 1c-3.300 0-5.500.6-5.500 1s2.200 1 5.500 1 5.500-.6 5.500-1-2.200-1-5.500-1Z" />
        </svg>
        {{ t.why.located }}
      </li>
      <li>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill-rule="evenodd"
            d="M7 9h14v10H7V9Zm2 2v6h10v-6H9ZM4 20h20v2H4v-2Z" />
          <path class="why__detail" d="M1 2a10 10 0 0 1 10 6H9a8 8 0 0 0-8-4V2Zm0 4a6 6 0 0 1 5 2.500H4A5 5 0 0 0 1 8V6Z" />
          <path class="why__detail why__extra" d="M1-2a14 14 0 0 1 14 10h-2A12 12 0 0 0 1 0v-2Z" />
        </svg>
        {{ t.why.remote }}
      </li>
    </ul>

    <a class="btn-pill why__cta" routerLink="/" fragment="contact" (click)="scrollToSection('contact')">
      {{ t.why.cta }}
    </a>
  </div>
</div>

<app-arrow class="why-arrow" target="techstack" />
