@let t = translation.texts();

<div class="panel__inner">
  <h2 class="section-title outline-text">{{ t.skills.title }}</h2>

  <div class="skills">
    <p>{{ t.skills.intro }}</p>

    <ul class="skills__list">
      @for (skill of skills; track skill.title) {
        <li class="skills__item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="skill.path" /></svg>
          {{ skill.title }}
        </li>
      }
      <li class="skills__item">
        <span class="skills__question" aria-hidden="true">?</span>
        {{ t.skills.challenge }}
      </li>
    </ul>

    <div class="skills__footer">
      <p>{{ t.skills.more }}</p>
      <a class="btn-pill" routerLink="/" fragment="contact" (click)="scrollToSection('contact')">
        {{ t.skills.cta }}
      </a>
    </div>
  </div>
</div>

<app-arrow class="skills-arrow" target="projects" />
