@let t = translation.texts();

<div class="hero">
  <img class="hero__photo" src="assets/img/self/portrait-web.jpg" [alt]="t.hero.photoAlt" width="1200"
    height="1800" fetchpriority="high" />

  <div class="hero__title">
    <h1 class="hero__name">Matthias Tausch</h1>
    <p class="hero__role outline-text">Frontend Developer</p>
    <p class="hero__city">{{ t.hero.city }}</p>
  </div>

  <app-arrow class="hero__arrow" target="about" />
</div>
