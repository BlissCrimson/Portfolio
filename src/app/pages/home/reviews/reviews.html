@let t = translation.texts();

<div class="panel__inner">
  <h2 class="section-title outline-text">{{ t.references.title }}</h2>

  <div class="references">
    <ul #list class="references__list" [attr.aria-roledescription]="t.references.carousel" (scroll)="onScroll()">
      @for (slot of slots; track slot) {
        <li class="references__item">
          <blockquote>{{ t.references.quote }}</blockquote>
          <p class="references__author">
            <span class="references__name">{{ t.references.name }}</span>
            <span>{{ t.references.project }}</span>
          </p>
        </li>
      }
    </ul>

    <div class="references__dots">
      @for (slot of slots; track slot) {
        <button type="button" [attr.aria-label]="t.references.goTo + ' ' + (slot + 1)"
          [attr.aria-current]="selected() === slot ? 'true' : null" (click)="show(slot)"></button>
      }
    </div>
  </div>
</div>

<app-arrow class="references-arrow" target="contact" />
